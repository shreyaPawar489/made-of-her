<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Made of Her: a network of women who went first</title>
<meta name="theme-color" content="#F6F1EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="achievements.css">
<link rel="stylesheet" href="coach.css">
</head>
<body>
  <!-- Onboarding (first visit). onboarding.js fills it. -->
  <section id="onboarding" hidden></section>

  <header id="nav" hidden>
    <div class="nav-inner">
      <a class="brand" href="#home">Made of <em>Her</em></a>
      <nav class="tabs">
        <a href="#home" data-tab="home">Home</a>
        <a href="#network" data-tab="network">Network <span id="netBadge" class="badge" hidden></span></a>
        <a href="#me" data-tab="me">Me</a>
      </nav>
      <a href="#me" class="nav-avatar" id="navAvatar" aria-label="Your portrait"></a>
    </div>
  </header>

  <main id="app" hidden>
    <!-- HOME -->
    <section id="home" class="page grid3">
      <aside class="col-left">
        <div id="profileCard" class="card">
          <canvas id="avatar" width="192" height="192"></canvas>
          <div id="profileInfo"></div>
        </div>
      </aside>
      <div class="col-center">
        <div id="composer"></div>
        <div id="feed"></div>
      </div>
      <aside class="col-right">
        <div id="steps"></div>
        <div id="onYourPath" class="card"></div>
      </aside>
    </section>

    <!-- NETWORK -->
    <section id="network" class="page" hidden></section>

    <!-- ME -->
    <section id="me" class="page" hidden>
      <div class="me-wrap">
        <div class="me-portrait card">
          <canvas id="bigPortrait" width="480" height="480"></canvas>
          <p class="hint">Tap a tile to see which woman is there and why.</p>
        </div>
        <div class="me-side">
          <div id="meInfo" class="card"></div>
          <div id="meTile" class="card" hidden></div>
          <div id="meList" class="card"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="coachDock"></div>
  <div id="modalRoot"></div>

  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="portrait.js"></script>
  <script src="app.js"></script>
  <script src="onboarding.js"></script>
  <script src="achievements.js"></script>
  <script src="coach.js"></script>
  <script src="network.js"></script>
</body>
</html>
